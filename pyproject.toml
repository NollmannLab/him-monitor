[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "him-monitor"
version = "0.1.0"
description = "Read-only overview and review tool for long HiM microscope experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
him-monitor = "him_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
